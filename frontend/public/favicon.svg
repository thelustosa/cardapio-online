<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Premium citrus gradient (orange to deep red-orange) representing food "zest" -->
    <linearGradient id="zestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9F43" />
      <stop offset="60%" stop-color="#FF5252" />
      <stop offset="100%" stop-color="#D82C2C" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#FF5252" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Dark circle base to match the premium dark theme of Zest Menu -->
  <circle cx="256" cy="256" r="230" fill="#18181C" />

  <g filter="url(#glow)">
    <!-- Elegant, fluid 'Z' ribbon resembling a twisted citrus peel (zest) -->
    <path d="M 150 180 C 190 140, 310 140, 350 180 L 160 340 C 200 380, 320 380, 360 340" 
          fill="none" 
          stroke="url(#zestGrad)" 
          stroke-width="50" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Gourmet food drops/citrus elements -->
    <circle cx="365" cy="115" r="20" fill="#FF9F43" />
    <circle cx="145" cy="395" r="16" fill="#FF5252" />
    <circle cx="110" cy="335" r="10" fill="#D82C2C" />
  </g>
</svg>